name: Stock Token index

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "11 3 * * *"
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        options:
          - collect
          - repair
          - retention
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source
        run: npm test

  operate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: robinhood-stock-token-index-operation
      cancel-in-progress: false
    env:
      INDEX_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source before publication
        run: npm test

      - name: Select operation
        id: operation
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            operation="${REQUESTED_OPERATION}"
          else
            case "${SCHEDULE}" in
              "7,22,37,52 * * * *") operation="collect" ;;
              "11 3 * * *") operation="repair" ;;
              "41 3 * * *") operation="retention" ;;
              *)
                echo "Unknown schedule: ${SCHEDULE}" >&2
                exit 1
                ;;
            esac
          fi

          printf 'operation=%s\n' "${operation}" >> "${GITHUB_OUTPUT}"

      - name: Run operation
        env:
          OPERATION: ${{ steps.operation.outputs.operation }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node cli.mjs "${OPERATION}" --store github --repository "${INDEX_REPOSITORY}"

      - name: Re-download and verify published state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cli.mjs verify --store github --repository "${INDEX_REPOSITORY}"
