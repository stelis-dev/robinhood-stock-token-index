name: USDG market data

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        options:
          - collect
          - repair
      baseCurrencyAddress:
        description: Repair base currency address
        required: false
        type: string
      poolId:
        description: Repair PoolId
        required: false
        type: string
      fromBlock:
        description: Repair range first block
        required: false
        type: string
      fromTimestamp:
        description: Repair range start
        required: false
        type: string
      untilBlock:
        description: Repair range end block
        required: false
        type: string
      untilTimestamp:
        description: Repair range end
        required: false
        type: string
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source
        run: npm test

  operate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: robinhood-stock-token-index-operation
      queue: max
      cancel-in-progress: false
    env:
      INDEX_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run market-data operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          INDEX_RPC_FALLBACK_URL_0: ${{ secrets.INDEX_RPC_FALLBACK_URL_0 }}
          INDEX_RPC_FALLBACK_URL_1: ${{ secrets.INDEX_RPC_FALLBACK_URL_1 }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          REPAIR_BASE: ${{ inputs.baseCurrencyAddress }}
          REPAIR_POOL_ID: ${{ inputs.poolId }}
          REPAIR_FROM_BLOCK: ${{ inputs.fromBlock }}
          REPAIR_FROM_TIMESTAMP: ${{ inputs.fromTimestamp }}
          REPAIR_UNTIL_BLOCK: ${{ inputs.untilBlock }}
          REPAIR_UNTIL_TIMESTAMP: ${{ inputs.untilTimestamp }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" || "${MANUAL_OPERATION}" == "collect" ]]; then
            node cli.mjs collect --store github --repository "${INDEX_REPOSITORY}"
          else
            node cli.mjs repair \
              --base "${REPAIR_BASE}" \
              --pool-id "${REPAIR_POOL_ID}" \
              --from-block "${REPAIR_FROM_BLOCK}" \
              --from-timestamp "${REPAIR_FROM_TIMESTAMP}" \
              --until-block "${REPAIR_UNTIL_BLOCK}" \
              --until-timestamp "${REPAIR_UNTIL_TIMESTAMP}" \
              --store github \
              --repository "${INDEX_REPOSITORY}"
          fi
