name: Stock Token index

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Pair operation to run
        required: true
        type: choice
        options:
          - collect
          - repair
      pair:
        description: Exact pair ID from registry/pairs.json
        required: true
        type: string
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source
        run: npm test

  operate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: robinhood-stock-token-index-operation
      queue: max
      cancel-in-progress: false
    env:
      INDEX_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run pair operation
        env:
          OPERATION: ${{ inputs.operation }}
          PAIR_ID: ${{ inputs.pair }}
          GITHUB_TOKEN: ${{ github.token }}
          INDEX_RPC_FALLBACK_URL_0: ${{ secrets.INDEX_RPC_FALLBACK_URL_0 }}
          INDEX_RPC_FALLBACK_URL_1: ${{ secrets.INDEX_RPC_FALLBACK_URL_1 }}
        run: node cli.mjs "${OPERATION}" --pair "${PAIR_ID}" --store github --repository "${INDEX_REPOSITORY}"
